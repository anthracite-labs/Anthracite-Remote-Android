name: AnthraciteRemote
options:
  bundleIdPrefix: dev.anthracite.remote
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  AnthraciteKit:
    path: .

settings:
  base:
    SWIFT_VERSION: "5.9"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"

targets:
  AnthraciteRemote:
    type: application
    platform: iOS
    sources:
      - path: App
      # The same reviewed host scripts the Android client ships. One copy, so a
      # fix cannot land on one platform only.
      - path: ../app/src/main/assets/host
        type: folder
        buildPhase: resources
    dependencies:
      - package: AnthraciteKit
        product: AnthraciteKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.anthracite.remote.ios
        PRODUCT_NAME: Anthracite
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_CFBundleDisplayName: Anthracite
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: "YES"
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: "NO"

  AnthraciteRemoteUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: AnthraciteRemote
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.anthracite.remote.ios.uitests
        TEST_TARGET_NAME: AnthraciteRemote
        GENERATE_INFOPLIST_FILE: "YES"

schemes:
  AnthraciteRemote:
    build:
      targets:
        AnthraciteRemote: all
        AnthraciteRemoteUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - AnthraciteRemoteUITests
