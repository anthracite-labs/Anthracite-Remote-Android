name: TEMP resolve package graph

# Temporary: produces the toolchain's own Package.resolved so it can be committed.
# Deleted once the file is in the repository. Not part of the permanent CI.
#
# Artifact download is not available to this session, so the file is posted as a
# pull-request comment and read from the API instead.

on:
  push:
    branches: [arena/097f72d0-anthracite-remote-android]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  resolve:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Resolve
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          swift --version
          cd ios
          swift package resolve
          test -s Package.resolved
          {
            echo '<!-- package-resolved -->'
            echo '```json'
            cat Package.resolved
            echo '```'
          } > /tmp/body.md
          gh pr comment 8 --repo "$GITHUB_REPOSITORY" --body-file /tmp/body.md
