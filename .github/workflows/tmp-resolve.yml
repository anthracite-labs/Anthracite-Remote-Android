name: TEMP resolve package graph

# Temporary: produces the toolchain's own Package.resolved so it can be committed.
# Deleted once the file is in the repository. Not part of the permanent CI.

on:
  push:
    branches: [arena/097f72d0-anthracite-remote-android]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resolve:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Resolve
        run: |
          set -euo pipefail
          swift --version
          cd ios
          swift package resolve
          test -s Package.resolved
          cat Package.resolved
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: package-resolved
          path: ios/Package.resolved
          if-no-files-found: error
          retention-days: 3
