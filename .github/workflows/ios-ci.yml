name: iOS CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ios:
    name: Swift package and simulator
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install XcodeGen
        # Not pinned to a checksum: no verified artifact was available for this
        # repository's CI, and printing the version is honest about what ran
        # rather than pretending the toolchain is reproducible. Recorded as a gap
        # in docs/support-matrix.md.
        run: |
          set -euo pipefail
          brew install xcodegen
          xcodegen --version
      - name: Build and test
        run: sh ci/ios-build.sh
      - name: Keep the result bundle
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ios-uitests-${{ github.run_id }}
          path: /tmp/ios-uitests.xcresult
          if-no-files-found: ignore
          retention-days: 14
