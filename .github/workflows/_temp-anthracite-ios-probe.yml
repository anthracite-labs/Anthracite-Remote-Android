name: _temp ios probe
on:
  push:
    branches: [arena/097f72d0-anthracite-remote-android]
    paths: ['.github/workflows/_temp-anthracite-ios-probe.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: toolchain
        run: |
          xcodebuild -version
          swift --version
          xcrun simctl list devices available | head -20
          which brew xcodegen || true
