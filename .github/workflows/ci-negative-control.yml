# Temporary, isolated negative control. Remove after inspecting the run.
name: Temporary compiler failure gate control
on:
  push:
    branches: [arena/53b81d55-anthracite-remote-android]
    paths: [.github/workflows/ci-negative-control.yml]

permissions:
  contents: read

jobs:
  compile_negative_control:
    name: Expected-red Kotlin compile gate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
          packages: platform-tools platforms;android-37.0 build-tools;37.0.0
      - name: Inject compiler error in this disposable runner only
        run: |
          printf '%s\n' 'package dev.anthracite.remote' 'internal val compilerGateNegativeControl = unresolvedGateSentinel_2026' > app/src/main/java/dev/anthracite/remote/CompilerGateNegativeControl.kt
      - name: Compile with the permanent diagnostics job command
        id: compile
        continue-on-error: true
        run: |
          set -euo pipefail
          ./gradlew --continue --console=plain \
            :app:compileDebugKotlin :app:compileDebugUnitTestKotlin \
            :app:processDebugResources :app:mergeDebugResources \
            > compile-negative.log 2>&1
      - name: Require the intended compiler diagnostic (not an infrastructure failure)
        if: always()
        run: |
          set -euo pipefail
          grep -F 'CompilerGateNegativeControl.kt' compile-negative.log
          grep -F 'unresolvedGateSentinel_2026' compile-negative.log
      - name: Save complete compiler diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: compiler-negative-control-${{ github.run_id }}
          path: compile-negative.log
          if-no-files-found: warn
          retention-days: 7
      - name: Mark compile failure exactly as the permanent gate does
        if: always()
        env:
          COMPILE_RESULT: ${{ steps.compile.outcome }}
        run: test "$COMPILE_RESULT" = success
