name: _temp ios
on:
  push:
    branches: [arena/097f72d0-anthracite-remote-android]
    paths:
      - 'ios/**'
      - 'ci/ios-build.sh'
      - '.github/workflows/_temp-anthracite-ios.yml'
permissions:
  contents: read
jobs:
  ios:
    name: iOS (Swift package + simulator)
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Build and test
        run: sh ci/ios-build.sh
      - name: Keep the result bundle
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ios-uitests-${{ github.run_id }}
          path: /tmp/ios-uitests.xcresult
          if-no-files-found: ignore
          retention-days: 14
