name: Release candidate evidence (unsigned)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evidence:
    name: Build APK, SBOM and attestations
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
          packages: platform-tools platforms;android-37.0 build-tools;37.0.0
      - name: Build unsigned release candidate and SBOM
        run: |
          set -euo pipefail
          ./gradlew :app:assembleDebug cyclonedxBom --stacktrace
          test -s app/build/outputs/apk/debug/app-debug.apk
          test -s build/reports/cyclonedx/bom.json
          sha256sum app/build/outputs/apk/debug/app-debug.apk > apk.sha256
          sha256sum -c apk.sha256
      - name: Attest exact APK build
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: app/build/outputs/apk/debug/app-debug.apk
      - name: Attest exact APK dependency SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: app/build/outputs/apk/debug/app-debug.apk
          sbom-path: build/reports/cyclonedx/bom.json
      - name: Retain APK, SBOM and digest
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-apk-evidence-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 30
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            build/reports/cyclonedx/bom.json
            apk.sha256
