name: PR validation

on:
  push:
    branches:
      - arena/c3af986f-anthracite-remote-android
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Shell, unit, lint, and debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.1
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
          packages: platform-tools platforms;android-37.0 build-tools;37.0.0

      - name: Environment validation
        run: |
          set -euo pipefail
          mkdir -p ci-diagnostics
          {
            echo "java: $(java -version 2>&1 | head -n 1)"
            echo "javac: $(javac -version 2>&1)"
            echo "bash: $(bash --version | head -n 1)"
            echo "os: $(. /etc/os-release && printf '%s %s' "$ID" "$VERSION_ID")"
            echo "ANDROID_HOME=${ANDROID_HOME:-}"
            echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-}"
            test -x ./gradlew
            ./gradlew --version
            command -v sdkmanager
            command -v ss
            command -v tar
            command -v sha256sum
            command -v ssh-keygen
            sdkmanager --list_installed
          } | tee ci-diagnostics/environment.txt
          sdk_dir="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$sdk_dir"
          printf 'sdk.dir=%s\n' "$sdk_dir" > local.properties

      - name: Shell validation
        run: |
          set -euo pipefail
          bash -n app/src/main/assets/install-opencode.sh
          bash app/src/test/shell/install-opencode-test.sh

      - name: Dependency graph
        run: |
          set -euo pipefail
          mkdir -p ci-diagnostics
          ./gradlew :app:dependencies --configuration debugRuntimeClasspath --stacktrace \
            | tee ci-diagnostics/debug-runtime-classpath.txt

      - name: Android unit tests
        run: |
          set +e
          ./gradlew testDebugUnitTest --stacktrace > ci-diagnostics/unit-tests.log 2>&1
          code=$?
          if [ "$code" -ne 0 ]; then
            bash .github/workflows/emit-failure.sh ci-diagnostics/unit-tests.log
            exit "$code"
          fi

      - name: Android lint
        run: |
          set +e
          ./gradlew lintDebug --stacktrace > ci-diagnostics/lint.log 2>&1
          code=$?
          if [ "$code" -ne 0 ]; then
            bash .github/workflows/emit-failure.sh ci-diagnostics/lint.log
            exit "$code"
          fi

      - name: Assemble debug APK
        run: |
          set +e
          ./gradlew assembleDebug --stacktrace > ci-diagnostics/assemble.log 2>&1
          code=$?
          if [ "$code" -ne 0 ]; then
            bash .github/workflows/emit-failure.sh ci-diagnostics/assemble.log
            exit "$code"
          fi

      - name: Inspect APK
        run: |
          set -euo pipefail
          mkdir -p ci-diagnostics
          apk=app/build/outputs/apk/debug/app-debug.apk
          test -s "$apk"
          sha256sum "$apk" | tee ci-diagnostics/apk-sha256.txt
          stat -c '%s %n' "$apk" | tee ci-diagnostics/apk-size.txt
          unzip -l "$apk" | tee ci-diagnostics/apk-list.txt
          unzip -l "$apk" | grep -q 'assets/install-opencode.sh'
          unzip -l "$apk" | grep -q 'assets/THIRD-PARTY-NOTICES.md'
          unzip -l "$apk" | grep -q 'assets/LICENSE'
          if unzip -l "$apk" | grep -E 'libopencode|opencode-linux|jni/'; then
            echo "APK contains an OpenCode or native runtime" >&2
            exit 1
          fi
          sdk_dir="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          aapt=$(find "$sdk_dir/build-tools" -type f -name aapt | sort | tail -n 1)
          test -n "$aapt"
          "$aapt" dump badging "$apk" | tee ci-diagnostics/apk-badging.txt
          "$aapt" dump permissions "$apk" | tee ci-diagnostics/apk-permissions.txt
          grep -q "package: name='dev.anthracite.remote'" ci-diagnostics/apk-badging.txt
          grep -q "sdkVersion:'28'" ci-diagnostics/apk-badging.txt
          grep -q "targetSdkVersion:'36'" ci-diagnostics/apk-badging.txt
          if grep -E "android.permission.(READ|WRITE)_EXTERNAL_STORAGE|android.permission.MANAGE_EXTERNAL_STORAGE" ci-diagnostics/apk-permissions.txt; then
            echo "unexpected storage permission" >&2
            exit 1
          fi

      - name: Upload validation artifacts
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: pr1-validation-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.xml
            ci-diagnostics/
