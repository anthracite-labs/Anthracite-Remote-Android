name: _temp-anthracite-p1
# TEMPORARY feature-branch verification workflow for the P1 corrective work.
# It exists only to run the permanent checks against a branch that is not `main`.
# Delete this file before the branch is proposed for merge.

on:
  push:
    branches:
      - arena/097f72d0-anthracite-remote-android
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host_kit:
    name: Host kit (cancel identity + plan integrity)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Syntax under dash and bash
        run: |
          set -euo pipefail
          for script in app/src/main/assets/host/*.sh; do
            bash -n "$script"
            dash -n "$script"
          done
      - name: Runner and status suite
        run: |
          set -euo pipefail
          for interpreter in dash bash; do
            echo "== runner under $interpreter"
            SHELL_UNDER_TEST="$interpreter" bash app/src/test/host/provision-run-test.sh 2>&1 \
              | tee "runner-$interpreter.log"
          done
      - name: Cancellation identity suite
        run: |
          set -euo pipefail
          for interpreter in dash bash; do
            echo "== cancel under $interpreter"
            SHELL_UNDER_TEST="$interpreter" bash app/src/test/host/provision-cancel-test.sh 2>&1 \
              | tee "cancel-$interpreter.log"
          done
      - name: Probe stays read-only
        run: |
          set -euo pipefail
          output=$(dash app/src/main/assets/host/anthracite-probe.sh)
          echo "$output" | grep -q '^machine_id='
          echo "$output" | grep -q '^done=1$'
      - name: Upload host-kit logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: p1-host-kit-${{ github.run_id }}
          retention-days: 7
          if-no-files-found: warn
          path: "*.log"

  android:
    name: Compile and P1 unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
          packages: platform-tools platforms;android-37.0 build-tools;37.0.0
      - name: Compile main and unit-test sources
        id: compile
        continue-on-error: true
        run: |
          mkdir -p ci-diagnostics
          ./gradlew --console=plain \
            :app:compileDebugKotlin :app:compileDebugUnitTestKotlin :app:processDebugResources \
            > ci-diagnostics/compile.log 2>&1
      - name: Collect distinct errors
        if: always()
        run: bash ci/collect-build-errors.sh ci-diagnostics/compile.log ci-diagnostics
      - name: Annotations batch 1
        if: always()
        run: bash ci/annotate-slice.sh ci-diagnostics 1
      - name: Annotations batch 2
        if: always()
        run: bash ci/annotate-slice.sh ci-diagnostics 2
      - name: Annotations batch 3
        if: always()
        run: bash ci/annotate-slice.sh ci-diagnostics 3
      - name: Annotations batch 4
        if: always()
        run: bash ci/annotate-slice.sh ci-diagnostics 4
      - name: Mark compile failure
        if: always()
        env:
          COMPILE_RESULT: ${{ steps.compile.outcome }}
        run: test "$COMPILE_RESULT" = success
      - name: P1 unit tests
        id: tests
        continue-on-error: true
        run: |
          mkdir -p ci-diagnostics
          ./gradlew --console=plain :app:testDebugUnitTest \
            --tests '*ProvisionJobsTest' \
            --tests '*ProvisionPlannerTest' \
            --tests '*HostFactsParserTest' \
            --tests '*HostStoreTest' \
            --tests '*PosixShellTest' \
            --tests '*DeployPlanTest' \
            --tests '*GitHubApiTest' 2>&1 | tee ci-diagnostics/unit.log
      - name: Annotate test failures
        if: always()
        run: |
          grep -E "^(FAILED|[A-Za-z0-9_.]+ > .* FAILED)" ci-diagnostics/unit.log 2>/dev/null \
            | head -n 10 | while IFS= read -r line; do printf '::error::%s\n' "$line"; done
          exit 0
      - name: Mark test failure
        if: always()
        env:
          TEST_RESULT: ${{ steps.tests.outcome }}
        run: test "$TEST_RESULT" = success
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: p1-junit-${{ github.run_id }}
          retention-days: 7
          if-no-files-found: warn
          path: app/build/reports/tests/
